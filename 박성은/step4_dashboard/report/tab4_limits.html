    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

cd9c \uc5c6\uc74c (\ubbf8\uacf5\uac1c)\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E4,039\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E4\uac1c \ubd84\uae30 \ub9e4\ucd9c \uc5c6\uc74c (\uc77c\ubd80 \ubd84\uae30)\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E815\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\ub9e4\ucd9c \ubbf8\uc81c\uacf5 \uc5c5\uc885\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E1,762\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc5c5\uc885 \ub9e4\ucd9c \ube44\uad50 \uc0c1\uad8c 30\uacf3 \ubbf8\ub9cc\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E133\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc810\uc218 \uc788\uc74c\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E13,773\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cul\u003E\n\u003Cli\u003E\uad00\uad11\ud2b9\uad6c 6\uacf3\uc740 \ub2e4\ub978 \uc0c1\uad8c\uacfc \uacb9\uccd0 \ub9e4\ucd9c\uc774 \uc911\ubcf5\ub418\ubbc0\ub85c \ucc98\uc74c\ubd80\ud130 \ube90\uc2b5\ub2c8\ub2e4.\u003C/li\u003E\n\u003Cli\u003E\ud3c9\uade0 \uc810\ud3ec \uc218 = 4\uac1c \ubd84\uae30 \uc810\ud3ec \uc218 \ud569 \u00f7 4 (\ubd84\uae30 \uc790\ub8cc\uac00 \uc5c6\uc73c\uba74 \uadf8 \ubd84\uae30\ub294 0\uac1c).\u003C/li\u003E\n\u003Cli\u003E\uc810\uc218\ub294 \uc11c\uc6b8 \uc804\uccb4 \uac19\uc740 \uc5c5\uc885 \uc548\uc758 \ubc31\ubd84\uc704\uc785\ub2c8\ub2e4. \uc790\uce58\uad6c\u00b7\uc720\ud615 \ud544\ud130\ub294 \ubcf4\uc774\ub294 \ubc94\uc704\ub9cc \uc881\ud788\uace0 \uc810\uc218\ub97c \ub2e4\uc2dc \uacc4\uc0b0\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3 id=\"spearman\"\u003E\uc601\uc5ed\ub07c\ub9ac \uc5bc\ub9c8\ub098 \uacb9\uce58\ub098 (Spearman \uc0c1\uad00, \uc810\uc218 \ub300\uc0c1 \uce78)\u003C/h3\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth style=\"text-align: left;\"\u003E\uc9dd\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003E\uc0c1\uad00\u003C/th\u003E\n\u003Cth style=\"text-align: left;\"\u003E\uc77d\ub294 \ubc95\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uacbd\uc7c1 \u00b7 \uc218\uc694(\uc138 \uac12 \ud3c9\uade0)\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E+0.47\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\ub458 \ub2e4 \uc720\ub3d9\uc778\uad6c\ub97c \uc368\uc11c \uc77c\ubd80 \uacb9\uce68. \uc0c1\uad8c \ucc3e\uae30 \ud0ed\uc758 '\uacb9\uce68 \ud655\uc778'\uc73c\ub85c \uc601\ud5a5 \ud655\uc778\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc9c1\uc7a5\uc778\uad6c \u00b7 \uc0c1\uc8fc\uc778\uad6c \ubc00\ub3c4\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E-0.55\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc11c\ub85c \ubc18\ub300\ub85c \uc6c0\uc9c1\uc784. \uc138 \uac12 \ud3c9\uade0\uc740 \uac00\uc6b4\ub370\ub85c \ubab0\ub9ac\uae30 \uc26c\uc6cc \uc8fc \uace0\uac1d\uce35 \uc120\ud0dd\uc744 \ub460\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\ub9e4\ucd9c \u00b7 \uacbd\uc7c1\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E-0.23\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\ub9e4\ucd9c \u00b7 \uc548\uc815\uc131\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E+0.04\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\ub9e4\ucd9c \u00b7 \uc218\uc694(\uc138 \uac12 \ud3c9\uade0)\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E-0.05\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ch3 id=\"_2\"\u003E\uc774 \uc810\uc218\ub85c \ub9d0\ud560 \uc218 \uc5c6\ub294 \uac83\u003C/h3\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth style=\"text-align: left;\"\u003E\ub9d0\ud558\uba74 \uc548 \ub418\ub294 \uac83\u003C/th\u003E\n\u003Cth style=\"text-align: left;\"\u003E\uc774\uc720\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\ucc3d\uc5c5 \uc131\uacf5 \ud655\ub960, \uc0dd\uc874\ud655\ub960\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc810\ud3ec\ubcc4 \uac1c\u00b7\ud3d0\uc5c5 \uc774\ub825\uc774 \uc5c6\uc2b5\ub2c8\ub2e4. \ud3d0\uc5c5\ub960\uc740 \ud655\ub960\uc774 \uc544\ub2d9\ub2c8\ub2e4\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc21c\uc774\uc775, \uc218\uc775\uc131\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc784\ub300\ub8cc\u00b7\uc778\uac74\ube44\u00b7\uc6d0\uac00 \uc790\ub8cc\uac00 \uc5c6\uc2b5\ub2c8\ub2e4. \ub9e4\ucd9c\uc740 \uce74\ub4dc\uc0ac \uc790\ub8cc \uae30\ubc18 \u003Cstrong\u003E\ucd94\uc815\uce58\u003C/strong\u003E\uc785\ub2c8\ub2e4\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc608\uc0b0 \uc801\ud569\uc131\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc784\ub300\ub8cc\u00b7\ubcf4\uc99d\uae08\u00b7\uad8c\ub9ac\uae08\u00b7\uc2dc\uc124\ube44 \uc790\ub8cc\uac00 \uc5c6\uc5b4 \u003Cstrong\u003E\uc608\uc0b0 \uc801\ud569\uc131\uc740 \ud310\ub2e8\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4\u003C/strong\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc804\ub144 \ub300\ube44 \uc131\uc7a5\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E2025\ub144 \uc790\ub8cc\ub9cc \uc788\uc5b4 \u003Cstrong\u003E\uc131\uc7a5\uc131\uc740 \uc0b0\ucd9c\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4\u003C/strong\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uac1c\ubcc4 \uac00\uac8c\uc758 \ub9e4\ucd9c\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\ub9e4\ucd9c\uc740 \uc0c1\uad8c\u00d7\uc5c5\uc885 \ub2e8\uc704 \ucd94\uc815 \ud569\uacc4\uc785\ub2c8\ub2e4. \uc810\ud3ec\ub2f9 \uc6d4\ub9e4\ucd9c\uc740 \ube44\uad50\uc6a9 \ub300\ub9ac\uc9c0\ud45c\uc785\ub2c8\ub2e4\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc6d0\uc778\uacfc \uacb0\uacfc\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc810\uc218\uc640 \uc9c0\ud45c\uc758 \uad00\uacc4\ub294 \uc0c1\uad00\uc774\uba70 \uc778\uacfc\uac00 \uc544\ub2d9\ub2c8\ub2e4\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cul\u003E\n\u003Cli\u003E\uc548\uc815\uc131\uc740 1\ub144\uce58 \ud3d0\uc5c5\ub960\uc774\ub77c \uc0c1\ubc18\uae30\uc640 \ud558\ubc18\uae30 \uac12\uc774 \uac70\uc758 \ub530\ub85c \ub189\ub2c8\ub2e4. \uadf8\ub798\uc11c \uae30\ubcf8 \uac00\uc911\uce58\ub97c \ub0ae\uac8c(15) \ub450\uc5c8\uc2b5\ub2c8\ub2e4.\u003C/li\u003E\n\u003Cli\u003E\uc9c1\uc7a5\uc778\uad6c\u00b7\uc0c1\uc8fc\uc778\uad6c\u00b7\uc9d1\uac1d\uc2dc\uc124\uc740 2025\ub144 \uc548\uc5d0\uc11c \uac12\uc774 \ubc14\ub00c\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.\u003C/li\u003E\n\u003Cli\u003E\ucd9c\ucc98: \uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc0c1\uad8c\ubd84\uc11d\uc11c\ube44\uc2a4 / \uc18c\uc0c1\uacf5\uc778\uc2dc\uc7a5\uc9c4\ud765\uacf5\ub2e8 \uc0c1\uac00(\uc0c1\uad8c)\uc815\ubcf4. \ub370\uc774\ud130 \uac00\uacf5: \uae40\uc9c0\uc601 step2_3\u00b7claude_dashboard (\uc77d\uae30\ub9cc \ud568).\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.2", "script_metadata_hash": null}, "version": "1"},
